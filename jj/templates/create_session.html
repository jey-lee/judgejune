<!DOCTYPE html>
<html>
<head>
    <title>Create Round</title>
    {% load static %}
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Create Round</h1>
        <form id="edit-session-form" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="name">ID</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ session.id }}">
            </div>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ session.name }}">
            </div>
            <div class="form-group">
                <label for="resolution">Resolution</label>
                <input type="text" class="form-control" id="resolution" name="resolution" value="{{ session.resolution }}">
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="aff_speaker1">Affirmative Speaker 1</label>
                        <input type="text" class="form-control" id="aff_speaker1" name="aff_speaker1" value="{{ form.aff_speaker1.value }}">
                    </div>
                    <div class="form-group">
                        <label for="aff_speaker2">Affirmative Speaker 2</label>
                        <input type="text" class="form-control" id="aff_speaker2" name="aff_speaker2" value="{{ form.aff_speaker2.value }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="con_speaker1">Negative Speaker 1</label>
                        <input type="text" class="form-control" id="con_speaker1" name="con_speaker1" value="{{ form.con_speaker1.value }}">
                    </div>
                    <div class="form-group">
                        <label for="con_speaker2">Negative Speaker 2</label>
                        <input type="text" class="form-control" id="con_speaker2" name="con_speaker2" value="{{ form.con_speaker2.value }}">
                    </div>
                </div>
            </div>
            
            <div class="form-group mt-3">
                <label for="details">Details</label>
                <textarea class="form-control" id="details" name="details">{{ form.details.value }}</textarea>
            </div>
            <div class="form-group mt-3">
                <label for="response">Response</label>
                <textarea class="form-control" id="response" name="response" readonly>{{ form.response.value }}</textarea>
            </div>
            <button type="submit" class="btn btn-success btn-block mt-3">Save Changes</button>
            <button type="button" class="btn btn-primary btn-block mt-3" onclick="generateResponse()">Generate Response</button>
        </form>
        <div class="text-center mt-4">
            <a href="{% url 'member_overview' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
