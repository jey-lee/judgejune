<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <title>Index Page</title>
    {% load static %}

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Codescandy" />

    <!-- Libs CSS -->
    <link href="{% static '/assets/fonts/feather/feather.css' %}" rel="stylesheet" />
    <link href="{% static '/assets/libs/bootstrap-icons/font/bootstrap-icons.min.css' %}" rel="stylesheet" />
    <link href="{% static '/assets/libs/simplebar/dist/simplebar.min.css' %}" rel="stylesheet" />

    <!-- Theme CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/theme.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <title>Coming soon | Geeks - Bootstrap 5 Template</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Libs JS -->
    <script src="{% static '/assets/libs/@popperjs/core/dist/umd/popper.min.js' %}"></script>
    <script src="{% static '/assets/libs/bootstrap/dist/js/bootstrap.min.js' %}"></script>
    <script src="{% static '/assets/libs/simplebar/dist/simplebar.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://sdk.symbl.ai/js/beta/symbl-web-sdk/latest/symbl.min.js"></script>

    <script>
        const accessToken = '{{ accessToken }}';
        var connection;
        const start = async () => {
            try {
                document.getElementById("recording-dot").style.display = "inline-block"; // Show glowing dot

                // Symbl recommends replacing the App ID and App Secret with an Access Token for authentication in production applications.
                // For more information about authentication see https://docs.symbl.ai/docs/developer-tools/authentication/.
                const symbl = new Symbl({
                    accessToken: accessToken,
                });

                // Open a Streaming API WebSocket Connection and start processing audio from your input device.
                connection = await symbl.createAndStartNewConnection();

                // Retrieve real-time transcription from the conversation.
                connection.on("message", (speechData) => {
                    speechData.forEach((item) => {
                        document.querySelector("#transcription").value += item.payload.content + " ";
                    });
                });

                // Retrieve real-time transcription from the conversation.
                connection.on("speech_recognition", (speechData) => {
                    const transcript = speechData.punctuated.transcript;
                    document.querySelector("#speechRecognition").innerHTML = getLastWords(transcript, 15);;
                });

                // This is a helper method for testing purposes.
                // It waits 60 seconds before continuing to the next API call.
                await Symbl.wait(4000000);

                // Stops processing audio, but keeps the WebSocket connection open.
                await connection.stopProcessing();

                // Closes the WebSocket connection.
                connection.disconnect();
                document.getElementById("recording-dot").style.display = "none"; // Hide glowing dot
            } catch (e) {
                // Handle errors here.
                document.getElementById("recording-dot").style.display = "none"; // Hide glowing dot
            }
        }

        function stopRecording() {
            // Closes the WebSocket connection.
            connection.disconnect();
            document.getElementById("recording-dot").style.display = "none"; // Hide glowing dot
        }

        function getLastWords(text, wordCount) {
            // Split the text into an array of words
            const words = text.split(" ");

            // Take the last `wordCount` words
            const lastWords = words.slice(-wordCount);

            // Join the last words back into a string and return
            return lastWords.join(" ");
        }
    </script>
</head>


<body class="bg-white">
    <!--PROFILE START-->
    <div class="card">
        <!--img-->
        <div class="rounded-top-3 profile-card-header">
            <h1 class="m-4 text-white">Round - {{ form.name.value }}</h1>
        </div>
        <div class="card-body p-md-5">
            <div class="d-flex flex-column gap-5">
                <div class="d-flex flex-column gap-5">
                    <div class="d-flex flex-column gap-3">
                        <div class="d-flex flex-md-row flex-column justify-content-between gap-2">
                            <!--heading-->
                            <div class="container mt-5">
                                <form id="edit-session-form" method="post">
                                    {% csrf_token %}
                                    <div class="form-group">
                                        <label for="name"><strong>Name</strong></label>
                                        <input type="text" class="form-control" id="name" name="name"
                                            value="{{ form.name.value }}">
                                    </div>
                                    <div class="form-group">
                                        <label for="resolution"><strong>Resolution</strong></label>
                                        <input type="text" class="form-control" id="resolution" name="resolution"
                                            value="{{ form.resolution.value }}">
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="aff_speaker1"><strong>Affirmative Speaker 1</strong></label>
                                                <input type="text" class="form-control" id="aff_speaker1"
                                                    name="aff_speaker1" value="{{ form.aff_speaker1.value }}">
                                            </div>
                                            <div class="form-group">
                                                <label for="aff_speaker2"><strong>Affirmative Speaker 2</strong></label>
                                                <input type="text" class="form-control" id="aff_speaker2"
                                                    name="aff_speaker2" value="{{ form.aff_speaker2.value }}">
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="form-group">
                                                <label for="con_speaker1"><strong>Negative Speaker 1</strong></label>
                                                <input type="text" class="form-control" id="con_speaker1"
                                                    name="con_speaker1" value="{{ form.con_speaker1.value }}">
                                            </div>
                                            <div class="form-group">
                                                <label for="con_speaker2"><strong>Negative Speaker 2</strong></label>
                                                <input type="text" class="form-control" id="con_speaker2"
                                                    name="con_speaker2" value="{{ form.con_speaker2.value }}">
                                            </div>
                                        </div>
                                    </div>

                                    <div class="form-group mt-3">
                                        <label for="transcription" class="d-flex align-items-center">
                                            <strong>Live Transcription</strong>
                                            <span id="recording-dot"
                                                style="display: none; margin-left: 10px; width: 10px; height: 10px; background-color: red; border-radius: 50%; box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);"></span>
                                        </label>
                                        <h6 id="speechRecognition">Live transcriptions to be shown here.</h6>
                                        <textarea class="form-control" id="transcription" name="transcription" rows="10"
                                            style="height: 300;"
                                            value="{{ form.transcription.value }}">{{ form.transcription.value }}</textarea>
                                        </textarea>
                                        <!-- Recording Buttons -->
                                        <div class="d-flex justify-content-center mt-3">
                                            <button type="button" class="btn btn-danger me-2"
                                                onclick="javascript: start()">
                                                <i class="bi bi-mic-fill" style="font-size: 1.0rem;"></i>
                                            </button>

                                            <button type="button" class="btn btn-secondary me-2"
                                                onclick="stopRecording()">
                                                <i class="bi bi-pause-fill" style="font-size: 1.0rem;"></i>
                                            </button>
                                        </div>

                                        <label for="results"><strong>Results</strong></label>
                                        <textarea class="form-control" id="results" name="results" rows="10"
                                            style="height: 300;">{{ form.results.value }}</textarea>
                                        </textarea>

                                        <div class="d-flex justify-content-center mt-3">
                                            <button type="button" class="btn btn-info btn-block"
                                                onclick="generateResponse()">Generate Results</button>
                                        </div>


                                    </div>

                                    <div class="text-center mt-4">
                                        <button type="submit" class="btn btn-success btn-block mt-3">Save
                                            Changes</button>
                                        <button type="button" class="btn btn-secondary btn-block mt-3">
                                            <a href="{% url 'profile' %}" class="text-white">Back to
                                                Profile</a></button>
                                    </div>

                                </form>

                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--PROFILE END-->

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        function generateResponse() {
            let data_detail = {
                'resolution': $('#resolution').val(),
                'aff_speaker1': $('#aff_speaker1').val(),
                'aff_speaker2': $('#aff_speaker2').val(),
                'con_speaker1': $('#con_speaker1').val(),
                'con_speaker2': $('#con_speaker2').val(),
                'constructive1': $('#constructive1').val(),
                'constructive2': $('#constructive2').val(),
                'crossfire1': $('#crossfire1').val(),
                'rebuttal1': $('#rebuttal1').val(),
                'rebuttal2': $('#rebuttal2').val(),
                'crossfire2': $('#crossfire2').val(),
                'summary1': $('#summary1').val(),
                'summary2': $('#summary2').val(),
                'grand_crossfire': $('#grand_crossfire').val(),
                'final_focus1': $('#final_focus1').val(),
                'final_focus2': $('#final_focus2').val(),
            };

            let data = {
                'resolution': $('#resolution').val(),
                'transcription': $('#transcription').val(),
            }

            $.ajax({
                type: 'POST',
                url: '{% url "generate_response" %}',
                data: JSON.stringify(data),
                contentType: 'application/json',
                headers: { 'X-CSRFToken': csrftoken },
                success: function (response) {
                    $('#results').val(response.results);
                }
            });

            function renderMarkdown(markdownText) {
                // Convert Markdown to HTML
                const htmlContent = marked(markdownText);

                // Render the HTML in a container
                document.getElementById('markdownPreview').innerHTML = htmlContent;
            }
        }
    </script>
    <style>
        #recording-dot {
            animation: glow 1s infinite;
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 5px rgba(215, 136, 136, 0.5);
            }

            50% {
                box-shadow: 0 0 15px rgb(134, 40, 40);
            }

            100% {
                box-shadow: 0 0 5px rgba(171, 5, 5, 0.5);
            }
        }
    </style>
    <!-- Theme JS -->
    <script src="{% static '/assets/js/theme.min.js' %}"></script>
    <script src="{% static '/assets/js/vendors/sidebarMenu.js' %}"></script>
    <script src="{% static '/assets/libs/prismjs/prism.js' %}"></script>
    <script src="{% static '/assets/libs/prismjs/components/prism-scss.min.js' %}"></script>
    <script src="{% static '/assets/libs/prismjs/plugins/toolbar/prism-toolbar.min.js' %}"></script>
    <script src="{% static '/assets/libs/prismjs/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js' %}"></script>

</body>

</html>
