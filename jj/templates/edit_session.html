    <style>
        /* Subtle Slow Blinking Apple Liquid Glow for Text Area & Record Button */
        textarea#transcription.recording-active,
        textarea#transcription.recording-active:focus,
        textarea#transcription.recording-active:hover {
            border: 1.5px solid #FF2D55 !important;
            outline: none !important;
            animation: subtleSlowBlink 2.6s infinite alternate ease-in-out !important;
        }

        button#mic-record-btn.recording-active {
            background: linear-gradient(135deg, #FF2D55 0%, #FF3B30 100%) !important;
            border-color: rgba(255, 255, 255, 0.8) !important;
            color: #ffffff !important;
            animation: subtleSlowPulse 2.6s infinite alternate ease-in-out !important;
        }

        @keyframes subtleSlowPulse {
            0% {
                opacity: 0.4;
                box-shadow: 0 0 2px rgba(255, 45, 85, 0.1);
                transform: scale(0.99);
            }
            100% {
                opacity: 1;
                box-shadow: 0 0 20px rgba(255, 45, 85, 0.6), 0 0 35px rgba(255, 45, 85, 0.35);
                transform: scale(1.03);
            }
        }

        @keyframes subtleSlowBlink {
            0% {
                border-color: rgba(255, 45, 85, 0.05) !important;
                box-shadow: 0 0 0px transparent, inset 0 0 0px transparent !important;
            }
            100% {
                border-color: #FF2D55 !important;
                box-shadow: 0 0 16px rgba(255, 45, 85, 0.5), inset 0 0 8px rgba(255, 45, 85, 0.25) !important;
            }
        }
    </style>

    <title>JudgeAssist</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Libs JS -->
    <script src="{% static '/assets/libs/@popperjs/core/dist/umd/popper.min.js' %}"></script>
    <script src="{% static '/assets/libs/bootstrap/dist/js/bootstrap.min.js' %}"></script>
    <script src="{% static '/assets/libs/simplebar/dist/simplebar.min.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        let cartesiaWs = null;
        let audioContext = null;
        let localStream = null;
        let audioProcessor = null;
        let finalizedText = "";
        let currentTurnTranscript = "";

        let lastSpeechTimestamp = Date.now();
        let pauseNewlinesAdded = false;
        let pauseMonitorInterval = null;

        let cursorVisible = true;
        let cursorInterval = null;
        let isRecordingActive = false;

        function startCursorBlink() {
            isRecordingActive = true;
            cursorVisible = true;
            if (cursorInterval) clearInterval(cursorInterval);
            cursorInterval = setInterval(() => {
                cursorVisible = !cursorVisible;
                updateTextArea();
            }, 500);
        }

        function stopCursorBlink() {
            isRecordingActive = false;
            if (cursorInterval) {
                clearInterval(cursorInterval);
                cursorInterval = null;
            }
            cursorVisible = false;
            updateTextArea();
        }

        function updateTextArea() {
            const transcriptionArea = document.getElementById('transcription');
            if (!transcriptionArea) return;

            let fullText = finalizedText;
            if (currentTurnTranscript && currentTurnTranscript.trim()) {
                const trimmedTurn = currentTurnTranscript.trim();
                if (!finalizedText.trim().endsWith(trimmedTurn)) {
                    if (fullText && !fullText.endsWith(" ") && !fullText.endsWith("\n")) {
                        fullText += " ";
                    }
                    fullText += currentTurnTranscript;
                }
            }
            if (isRecordingActive && cursorVisible) {
                fullText += " ▌";
            }
            transcriptionArea.value = fullText;
            transcriptionArea.scrollTop = transcriptionArea.scrollHeight;
        }

        function startPauseMonitor() {
            lastSpeechTimestamp = Date.now();
            pauseNewlinesAdded = false;
            if (pauseMonitorInterval) clearInterval(pauseMonitorInterval);

            pauseMonitorInterval = setInterval(() => {
                if (!cartesiaWs || cartesiaWs.readyState !== WebSocket.OPEN) return;

                const elapsed = Date.now() - lastSpeechTimestamp;
                if (elapsed >= 5000 && !pauseNewlinesAdded) {
                    if (finalizedText && finalizedText.trim().length > 0) {
                        if (!finalizedText.endsWith("\n\n")) {
                            if (finalizedText.endsWith("\n")) {
                                finalizedText += "\n";
                            } else {
                                finalizedText += "\n\n";
                            }
                            updateTextArea();
                        }
                    }
                    pauseNewlinesAdded = true;
                }
            }, 500);
        }

        function stopPauseMonitor() {
            if (pauseMonitorInterval) {
                clearInterval(pauseMonitorInterval);
                pauseMonitorInterval = null;
            }
        }

        async function initRealtime() {
            try {
                // Get short-lived Cartesia Access Token from Django backend
                const tokenResponse = await fetch("/api/realtime_token/");
                const data = await tokenResponse.json();

                if (data.error) {
                    console.error("Error fetching Cartesia token:", data.error);
                    alert("Failed to get Cartesia access token: " + data.error);
                    return;
                }

                const accessToken = data.token;
                const transcriptionArea = document.getElementById('transcription');

                // Preserve any existing text in the textarea (clean any existing cursor)
                finalizedText = transcriptionArea.value.replace(/ ▌/g, "");
                currentTurnTranscript = "";
                if (finalizedText && !finalizedText.endsWith(" ") && !finalizedText.endsWith("\n")) {
                    finalizedText += " ";
                }

                // Cartesia Ink 2 STT WebSocket URL with 2000ms turn timeout for fast turn finalization
                const wsUrl = `wss://api.cartesia.ai/stt/turns/websocket?model=ink-2&encoding=pcm_s16le&sample_rate=16000&cartesia_version=2026-08-14&turn_end_timeout_ms=2000&access_token=${encodeURIComponent(accessToken)}`;

                cartesiaWs = new WebSocket(wsUrl);

                cartesiaWs.onopen = async () => {
                    console.log("Cartesia Ink 2 STT WebSocket connected successfully");
                    const micBtn = document.getElementById('mic-record-btn');
                    if (micBtn) micBtn.classList.add('recording-active');
                    const txtArea = document.getElementById('transcription');
                    if (txtArea) txtArea.classList.add('recording-active');

                    startPauseMonitor();
                    startCursorBlink();

                    try {
                        // Request microphone access
                        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });

                        const source = audioContext.createMediaStreamSource(localStream);
                        // Buffer size 2048 (~128ms chunks) for low latency
                        audioProcessor = audioContext.createScriptProcessor(2048, 1, 1);

                        source.connect(audioProcessor);
                        audioProcessor.connect(audioContext.destination);

                        audioProcessor.onaudioprocess = (e) => {
                            if (!cartesiaWs || cartesiaWs.readyState !== WebSocket.OPEN) return;

                            const inputFloat32 = e.inputBuffer.getChannelData(0);
                            const pcm16 = new Int16Array(inputFloat32.length);

                            // Convert float32 [-1, 1] to Int16 PCM [-32768, 32767]
                            for (let i = 0; i < inputFloat32.length; i++) {
                                let s = Math.max(-1, Math.min(1, inputFloat32[i]));
                                pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                            }

                            cartesiaWs.send(pcm16.buffer);
                        };

                    } catch (micErr) {
                        console.error("Microphone access error:", micErr);
                        alert("Microphone access failed: " + micErr.message);
                        stopTranscription();
                    }
                };

                cartesiaWs.onmessage = (e) => {
                    try {
                        const event = JSON.parse(e.data);

                        if (event.type === 'turn.update') {
                            // Live word-by-word streaming transcript update
                            if (event.transcript !== undefined && event.transcript.trim().length > 0) {
                                lastSpeechTimestamp = Date.now();
                                pauseNewlinesAdded = false;
                                currentTurnTranscript = event.transcript;
                                updateTextArea();
                            }
                        } else if (event.type === 'turn.end' || event.type === 'turn.eager_end') {
                            // Finalized turn
                            lastSpeechTimestamp = Date.now();
                            pauseNewlinesAdded = false;
                            const textToCommit = (event.transcript !== undefined ? event.transcript : currentTurnTranscript).trim();
                            if (textToCommit) {
                                const trimmedFinal = finalizedText.trim();
                                if (!trimmedFinal.endsWith(textToCommit)) {
                                    if (finalizedText && !finalizedText.endsWith(" ") && !finalizedText.endsWith("\n")) {
                                        finalizedText += " ";
                                    }
                                    finalizedText += textToCommit + " ";
                                }
                            }
                            currentTurnTranscript = "";
                            updateTextArea();
                        } else if (event.type === 'turn.start') {
                            lastSpeechTimestamp = Date.now();
                            pauseNewlinesAdded = false;
                            currentTurnTranscript = "";
                        } else if (event.type === 'error') {
                            console.error("Cartesia STT Error Event:", event);
                        }
                    } catch (parseErr) {
                        console.error("Error parsing Cartesia message:", parseErr);
                    }
                };

                cartesiaWs.onerror = (err) => {
                    console.error("Cartesia WebSocket error:", err);
                };

                cartesiaWs.onclose = () => {
                    console.log("Cartesia WebSocket connection closed");
                    stopPauseMonitor();
                    stopCursorBlink();
                    const micBtn = document.getElementById('mic-record-btn');
                    if (micBtn) micBtn.classList.remove('recording-active');
                    const txtArea = document.getElementById('transcription');
                    if (txtArea) txtArea.classList.remove('recording-active');
                };

            } catch (err) {
                console.error("Cartesia STT initialization failed:", err);
                stopTranscription();
            }
        }

        async function stopTranscription() {
            stopPauseMonitor();
            stopCursorBlink();
            if (cartesiaWs) {
                if (cartesiaWs.readyState === WebSocket.OPEN) {
                    try {
                        cartesiaWs.send(JSON.stringify({ type: "close" }));
                    } catch (e) {}
                    cartesiaWs.close();
                }
                cartesiaWs = null;
            }
            if (audioProcessor) {
                audioProcessor.disconnect();
                audioProcessor = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            const micBtn = document.getElementById('mic-record-btn');
            if (micBtn) micBtn.classList.remove('recording-active');
            const txtArea = document.getElementById('transcription');
            if (txtArea) txtArea.classList.remove('recording-active');
        }

        // Expose to global scope for buttons
        window.live = initRealtime;
        window.stopTranscription = stopTranscription;
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');

        function generateResponse_test() {
            var spinner = document.getElementById("loading-spinner");
            var button = document.getElementById("generate-btn");

            button.disabled = true;
            spinner.style.display = "block";

            setTimeout(function () {
                spinner.style.display = "none";
                button.disabled = false;
            }, 2000); // Simulate API call
        }

        function generateResponse() {
            var spinner = document.getElementById("loading-spinner");
            var button = document.getElementById("generate-btn");

            button.disabled = true;
            spinner.style.display = "block";

            let data_detail = {
                'event_type': $('#event_type').val(),
                'resolution': $('#resolution').val(),
                'aff_speaker1': $('#aff_speaker1').val(),
                'aff_speaker2': $('#aff_speaker2').val(),
                'con_speaker1': $('#con_speaker1').val(),
                'con_speaker2': $('#con_speaker2').val(),
                'constructive1': $('#constructive1').val(),
                'constructive2': $('#constructive2').val(),
                'crossfire1': $('#crossfire1').val(),
                'rebuttal1': $('#rebuttal1').val(),
                'rebuttal2': $('#rebuttal2').val(),
                'crossfire2': $('#crossfire2').val(),
                'summary1': $('#summary1').val(),
                'summary2': $('#summary2').val(),
                'grand_crossfire': $('#grand_crossfire').val(),
                'final_focus1': $('#final_focus1').val(),
                'final_focus2': $('#final_focus2').val(),
            };

            let data = {
                'resolution': $('#resolution').val(),
                'transcription': ($('#transcription').val() || '').replace(/ ▌/g, ''),
                'event_type': $('#event_type').val(),
            }

            $.ajax({
                type: 'POST',
                url: '{% url "generate_response" %}',
                data: JSON.stringify(data),
                contentType: 'application/json',
                headers: { 'X-CSRFToken': csrftoken },
                success: function (response) {
                    $('#results').val(response.results);

                    spinner.style.display = "none";
                    button.disabled = false;
                }
            });

            function renderMarkdown(markdownText) {
                // Convert Markdown to HTML
                const htmlContent = marked(markdownText);

                // Render the HTML in a container
                document.getElementById('markdownPreview').innerHTML = htmlContent;
            }


        }
    </script>
    <script>
        function updateParadigm() {
            var paradigmList = document.getElementById("paradigm");
            paradigmList.innerHTML = "";
            var resolution = document.getElementById("resolution").value || "[resolution]";
            var eventType = document.getElementById("event_type").value;
            var items = [];


            if (eventType === "Public Forum") {
                items = [
                    "Argumentation is focused on the resolution, where the Affirmative side is in support of said resolution and the Negative side is in opposition",
                    "Each speech presents independent argumentation for each side, refutations against the opposing side, defenses against such refutations, and comparisons between the implications of each argument",
                    "The round is structured by two constructives, two rebuttals, two summaries, and two final foci; disregard any new evidence or arguments presented in the last 4 speeches: these speeches should be cross applications or clarifications of arguments already made in the round",
                    "Upon completion, provide feedback for each speech, give a final decision on the side that won the debate, and explain your rationale for the decision",
                    "There should be specific arguments that you felt compelled to vote on for a side to win the round, no decision should be made for general strategy or eloquence"
                ];
            } else if (eventType === "Parliamentary Debate") {
                items = [
                    "The round is structured by four constructives and two rebuttals: constructives are speeches in which debates occur with new information and responses and rebuttals are speeches in which the main issues of the debate are weighed to show who wins. New information is not allowed in rebuttal speeches.",
                    "The format of the round is first affirmative construction (7 minutes), first negative constructive (8 minutes), second affirmative constructive (8 minutes), second negative constructive (8 minutes), negative rebuttal (4 minutes), affirmative rebuttal (5 minutes).",
                    "POIs, which are questions that examine the cases of the speaking side can be asked during constructive speeches. These interrupt the time and continue within the time. They are not allowed in the rebuttal speeches.",
                    "POOs, which pause time are used to point out new information being brought up in the rebuttal speeches, which violates the rules. It is up to you, the judge, to determine whether this information was previously mentioned or is new.",
                    "The criterion on which the round should be weighed will be provided by the debaters, whether it be a fact, policy, or value round (the definition of these rounds will also be provided). Please go with the framework that the debaters agree on, and if the weighing mechanism is contested, choose what seems most logical to you based on their arguments.",
                    "Although some evidence can be cited, unless contested, all points provided by debaters should be accepted as fact. However, detailed statistics and numbers should enhance the validity of points proposed by either side.",
                    "In Parli, the debaters must point out anything for it to be valid, so only take rebuttals and dropped points if the debaters point them out.",
                    "At the end of the round, please look over everything that has been said and make a decision. Give feedback on missed points of the debate, good areas, and analyze each speech so that speakers can see what they did good and what they can do better."
                ];
            }

            items.forEach(function (text, index) {
                var li = document.createElement("li");
                li.className = "list-group-item";
                li.textContent = text;
                if (index >= 3) li.style.display = "none";
                paradigmList.appendChild(li);
            });

            // Reset toggle button when event type is changed
            document.getElementById("toggle-more").textContent = "Show more";
        }

        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById("event_type").addEventListener("change", updateParadigm);
            updateParadigm();
            document.getElementById("toggle-more").addEventListener("click", function () {
                var items = document.querySelectorAll("#paradigm .list-group-item");
                var isExpanded = items[3].style.display === "list-item";

                items.forEach(function (item, index) {
                    if (index >= 3) {
                        item.style.display = isExpanded ? "none" : "list-item";
                    }
                });
                document.getElementById("toggle-more").textContent = isExpanded ? "Show more" : "Show less";
            });
        });
    </script>
